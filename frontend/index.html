<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Todo List</h1>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      />
      <button type="submit">Add</button>
    </form>

    <p id="error" class="error" hidden></p>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>No todos yet. Add one above.</p>
  </main>

  <!-- Generated at container start from the API_BASE env var; see
       frontend/docker-entrypoint.d/40-generate-config.sh. Safe to 404 in
       local dev (served with a plain static server) - app.js falls back
       to its default. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
